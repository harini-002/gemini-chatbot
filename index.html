<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Gemini AI Chatbot</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="app">

        <!-- Header -->
        <header class="header">
            <div class="brand">
                <div class="logo">✦</div>

                <div>
                    <h1>Gemini Chat</h1>
                    <span>AI Assistant</span>
                </div>
            </div>

            <button id="clearBtn" class="clear-btn">
                Clear Chat
            </button>
        </header>


        <!-- Chat Area -->
        <main id="chatContainer" class="chat-container">

            <!-- Welcome message -->
            <div class="message ai-message">
                <div class="avatar ai-avatar">✦</div>

                <div class="message-content">
                    <div class="message-name">Gemini</div>

                    <div class="bubble">
                    Hello! Harini R M👋 How can I help you today?
                    </div>
                </div>
            </div>

        </main>


        <!-- Typing Indicator -->
        <div id="typingIndicator" class="typing-indicator hidden">

            <div class="avatar ai-avatar">✦</div>

            <div class="typing-bubble">
                <span></span>
                <span></span>
                <span></span>
            </div>

        </div>


        <!-- Input Area -->
        <footer class="input-area">

            <div class="input-wrapper">

                <textarea
                    id="messageInput"
                    rows="1"
                    placeholder="Message Gemini..."
                    autocomplete="off"
                ></textarea>

                <button id="sendBtn" class="send-btn" aria-label="Send message">
                    ➤
                </button>

            </div>

            <p class="disclaimer">
                Gemini can make mistakes. Check important information.
            </p>

        </footer>

    </div>

    <script src="script.js"></script>

</body>
</html>
